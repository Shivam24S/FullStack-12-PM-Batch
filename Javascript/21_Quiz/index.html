<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101a35" />
    <link rel="stylesheet" href="style.css" />
    <title>JavaScript Quiz</title>
</head>

<body>
    <main class="quiz-shell">
        <section id="quiz-card" class="quiz-card" aria-label="JavaScript quiz">
            <header class="quiz-header">
                <div class="brand">
                    <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
                    <div>
                        <p class="eyebrow">Frontend fundamentals</p>
                        <h1>JavaScript Quiz</h1>
                    </div>
                </div>

                <div class="quiz-meta">
                    <span id="qnsNum">Question 1 / 10</span>
                    <span id="timer" class="timer" role="timer" aria-live="polite">30s</span>
                </div>
                <div class="progress-track" aria-hidden="true">
                    <span id="progress-bar"></span>
                </div>
            </header>

            <div class="quiz-content">
                <p class="question-label">Choose the best answer</p>
                <h2 id="qns">Question will appear here</h2>
                <div id="options" class="options-grid"></div>
            </div>

            <footer class="quiz-footer">
                <p id="answer-hint">Select an answer to continue</p>
                <button id="next-btn" class="next-btn" type="button" disabled>
                    <span>Next question</span>
                    <span class="arrow" aria-hidden="true">&rarr;</span>
                </button>
            </footer>
        </section>
    </main>

    <script src="./script.js"></script>
</body>

</html>
